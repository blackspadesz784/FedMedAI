# render.yaml — Render Deployment Configuration for FedMed AI Backend
# Learn more at https://render.com/docs/yaml-deploys

services:
  - type: web
    name: fedmedai
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r backend/requirements.txt && python training/generate_figures.py && mkdir -p dist && cp -r assets dist/ && cp -r css dist/ && cp -r js dist/ && cp *.html dist/ 2>/dev/null || true"
    startCommand: "cd backend && gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: MODEL_DIR
        value: models
      - key: GRADCAM_DIR
        value: gradcam_outputs
      - key: UPLOADS_DIR
        value: uploads
      - key: CORS_ORIGINS
        value: "*"
      - key: FLASK_DEBUG
        value: "false"
